<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080a0f;
      --surface:   #0e1119;
      --border:    #1e2535;
      --accent:    #e8ff5a;
      --accent2:   #ff5a7e;
      --text:      #c9d4f0;
      --muted:     #4a5470;
      --mono:      'Syne Mono', monospace;
      --sans:      'Syne', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ── starfield ── */
    canvas#stars {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ── scanline overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,.08) 3px,
        rgba(0,0,0,.08) 4px
      );
    }

    /* ── layout ── */
    main {
      position: relative; z-index: 2;
      height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      padding: 2rem;
    }

    /* ── signal badge ── */
    .badge {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .18em;
      color: var(--accent2);
      border: 1px solid var(--accent2);
      padding: .3em .9em;
      border-radius: 2px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp .5s .2s ease forwards;
      text-transform: uppercase;
      position: relative;
    }
    .badge::before {
      content: '';
      display: inline-block;
      width: .45em; height: .45em;
      border-radius: 50%;
      background: var(--accent2);
      margin-right: .6em;
      vertical-align: middle;
      animation: blink 1.2s step-start infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── big 404 ── */
    .four04 {
      font-size: clamp(7rem, 22vw, 16rem);
      font-weight: 800;
      line-height: .9;
      letter-spacing: -.04em;
      color: transparent;
      background: linear-gradient(135deg, #ffffff 0%, #3a4260 100%);
      -webkit-background-clip: text;
      background-clip: text;
      opacity: 0;
      animation: fadeUp .6s .4s ease forwards;
      position: relative;
      user-select: none;
    }
    /* glitch layers */
    .four04::before,
    .four04::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #ffffff 0%, #3a4260 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .four04::before {
      animation: glitch1 3.5s infinite;
      clip-path: polygon(0 20%, 100% 20%, 100% 40%, 0 40%);
      transform: translateX(-4px);
      color: var(--accent2);
      -webkit-text-fill-color: var(--accent2);
      background: none;
    }
    .four04::after {
      animation: glitch2 3.5s infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
      transform: translateX(4px);
      color: var(--accent);
      -webkit-text-fill-color: var(--accent);
      background: none;
    }
    @keyframes glitch1 {
      0%,90%,100% { opacity: 0; transform: translateX(0); }
      92%          { opacity: 1; transform: translateX(-6px); }
      94%          { opacity: 1; transform: translateX(4px);  }
      96%          { opacity: 0; }
    }
    @keyframes glitch2 {
      0%,90%,100% { opacity: 0; transform: translateX(0); }
      91%          { opacity: 1; transform: translateX(6px);  }
      93%          { opacity: 1; transform: translateX(-3px); }
      95%          { opacity: 0; }
    }

    /* ── headline ── */
    h1 {
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-top: 1.2rem;
      opacity: 0;
      animation: fadeUp .5s .6s ease forwards;
      color: var(--text);
    }

    p.sub {
      font-size: .9rem;
      color: var(--muted);
      margin-top: .6rem;
      max-width: 38ch;
      text-align: center;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp .5s .75s ease forwards;
    }

    /* ── URL block ── */
    .url-block {
      margin-top: 2.6rem;
      width: min(100%, 560px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp .5s .9s ease forwards;
      box-shadow: 0 0 0 1px rgba(232,255,90,.06), 0 24px 48px rgba(0,0,0,.5);
    }
    .url-block__header {
      display: flex; align-items: center; gap: .6rem;
      padding: .6rem 1rem;
      background: rgba(255,255,255,.03);
      border-bottom: 1px solid var(--border);
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot-r { background: #ff5f57; }
    .dot-y { background: #ffbd2e; }
    .dot-g { background: #28c840; }
    .url-block__label {
      font-family: var(--mono);
      font-size: .6rem;
      letter-spacing: .15em;
      color: var(--muted);
      text-transform: uppercase;
      margin-left: auto;
    }
    .url-block__body {
      padding: 1rem 1.2rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .url-icon {
      flex-shrink: 0;
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border: 1px solid var(--accent2);
      border-radius: 4px;
      color: var(--accent2);
      font-size: 1rem;
    }
    .url-text {
      font-family: var(--mono);
      font-size: .82rem;
      color: var(--text);
      word-break: break-all;
      line-height: 1.5;
    }
    .url-text .scheme { color: var(--muted); }
    .url-text .host   { color: var(--accent); }
    .url-text .path   { color: var(--text); }
    .url-block__footer {
      padding: .55rem 1.2rem;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: .5rem;
      background: rgba(255,90,126,.04);
    }
    .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent2);
      flex-shrink: 0;
      animation: blink 1.4s step-start infinite;
    }
    .url-block__footer span {
      font-family: var(--mono);
      font-size: .65rem;
      letter-spacing: .1em;
      color: var(--accent2);
      text-transform: uppercase;
    }



    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<canvas id="stars"></canvas>

<main>
  <div class="badge">Signal Lost</div>

  <div class="four04" data-text="404">404</div>

  <h1>Unknown Destination</h1>
  <p class="sub">We couldn't find the resource you're looking for. The address may be incorrect, removed, or simply doesn't exist.</p>

  <div class="url-block">
    <div class="url-block__header">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
      <span class="url-block__label">Requested URL</span>
    </div>
    <div class="url-block__body">
      <div class="url-icon">⚠</div>
      <div class="url-text" id="urlDisplay">
        <span class="scheme">https://</span><span class="host" id="hostPart"></span><span class="path" id="pathPart"></span>
      </div>
    </div>
    <div class="url-block__footer">
      <div class="status-dot"></div>
      <span>Host unreachable — no route to destination</span>
    </div>
  </div>


</main>

<script>
  /* ── parse & display current URL ── */
  (function () {
    const loc = window.location;
    const host = loc.hostname + (loc.port && loc.port !== '80' && loc.port !== '443' ? ':' + loc.port : '');
    const path = loc.pathname + loc.search + loc.hash;
    document.getElementById('hostPart').textContent = host;
    document.getElementById('pathPart').textContent = path === '/' ? '/' : path;
  })();

  /* ── starfield ── */
  (function () {
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let W, H, stars = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function init() {
      resize();
      stars = Array.from({ length: 800 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + .2,
        a: Math.random(),
        speed: Math.random() * .004 + .001,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function draw(t) {
      ctx.clearRect(0, 0, W, H);
      stars.forEach(s => {
        s.a = .3 + .7 * (.5 + .5 * Math.sin(t * s.speed * 1000 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,195,255,${s.a})`;
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }

    init();
    window.addEventListener('resize', init);
    requestAnimationFrame(draw);
  })();
</script>

</body></html>
